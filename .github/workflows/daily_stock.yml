name: Daily Tech Stock Briefing

on:
  schedule:
    # GitHub Actions 运行在 UTC 时间。
    # 示例 1: 美股开盘前（美东夏令时 08:30 AM = UTC 12:30），周一至周五执行：
    - cron: '30 12 * * 1-5'
    
    # 示例 2: 如果希望在亚洲早晨（北京时间 07:30 AM = UTC 23:30 前一天）收到：
    # - cron: '30 23 * * 0-4'

  # 允许在 GitHub 网页上手动点击立即运行，方便调试
  workflow_dispatch:

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: 执行科技股资讯生成与推送
        env:
          # 从仓库的加密 Secrets 中读取 API Key 和 Webhook 地址
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python tech_stock_daily.py
