name: Daily Tech Stock Briefing

on:
  schedule:
    - cron: '30 12 * * 1-5'

  # 允许在 GitHub 网页上手动点击立即运行，方便调试
 # workflow_dispatch:

  # 赋予工作流向仓库推送代码的权限
permissions:
  contents: write

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: 执行科技股资讯生成与推送
        env:
          # 从仓库的加密 Secrets 中读取 API Key 和 Webhook 地址
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python tech_stock_daily.py

      - name: 自动提交并更新 README.md
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: 自动更新每日科技股晨报 [skip ci]" || exit 0
          git push
